name: Release to npm

# Cutting a release:
#   1. Bump "version" in package.json and commit on the default branch.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z   (tag must match package.json)
#
# Auth: token-less, via npm trusted publishing (OIDC). Bind it once from a
# machine where you are logged in interactively (2FA):
#
#   npm trust github pi-free-provider --repo kslamph/pi-free-provider \
#     --file release.yml --allow-publish
#
# The binding must be created before the first release run and complete its
# first successful publish within 2 days, after which it is locked to this
# repository. This repository is PRIVATE: trusted publishing still works, but
# npm does not attach provenance attestations to builds from private repos.
# That is the only thing lost — the package itself publishes normally.
#
# Fallback (not used here): a granular token in the NPM_TOKEN secret with
# `env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`. Note that 2FA-bypass tokens
# lose direct publish in January 2027, so OIDC is the durable path.
#
# Private-repo Actions minutes are billed to the plan's included quota
# (2,000 min/month on Free); a release run costs well under a minute.
#
# Manual runs from the Actions tab are supported; re-runs are safe because an
# already-published version is skipped.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@^11.15.0

      - name: Verify tag matches package.json version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Releasing v${PKG_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The Bun relay is spawned from disk at run time, so a missing
      # zen-sidecar.ts silently breaks zenfree instead of failing loudly.
      - name: Validate tarball contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in index.ts sidecar.ts zen-sidecar.ts LICENSE README.md; do
            if ! grep -qE "[[:space:]]${f}$" /tmp/pack.txt; then
              echo "::error::${f} is missing from the published tarball"
              exit 1
            fi
          done

      - name: Skip if this version is already published
        id: check
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VER is already published — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing via OIDC — no token needed)
        if: steps.check.outputs.skip != 'true'
        run: |
          # Pre-release tags (v1.2.0-beta.1, …) go to the `next` dist-tag so
          # `latest` is never polluted. Manual branch runs publish to `latest`.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DIST_TAG="latest"
          case "$TAG_VERSION" in
            *-alpha*|*-beta*|*-rc*|*-next*) DIST_TAG="next" ;;
          esac
          npm publish --access public --tag "$DIST_TAG"

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
